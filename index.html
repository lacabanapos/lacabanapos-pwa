<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Cabaña" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%23d4af37'/%3E%3Ctext x='96' y='120' font-size='80' text-anchor='middle' fill='%23000'%3E🍽️%3C/text%3E%3C/svg%3E" />
    <title>La Cabaña - Terminal Móvil</title>
    <script>
      if ('serviceWorker' in navigator) {
        let hadController = Boolean(navigator.serviceWorker.controller);
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloadingForUpdate) return;
          reloadingForUpdate = true;
          window.location.reload();
        });

        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((registration) => {
          const checkForUpdate = () => {
            if (document.visibilityState === 'visible') void registration.update().catch(() => {});
          };
          // Check at startup and whenever an installed PWA is reopened.
          checkForUpdate();
          window.addEventListener('pageshow', checkForUpdate);
          document.addEventListener('visibilitychange', checkForUpdate);
          navigator.serviceWorker.addEventListener('controllerchange', () => { hadController = true; });
        }).catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
